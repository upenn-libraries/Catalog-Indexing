variables:
  FF_SCRIPT_SECTIONS: "true"
  GIT_CLONE_PATH: "${CI_BUILDS_DIR}/${CI_PROJECT_NAME}/${CI_JOB_ID}"
  # CI_DEBUG_SERVICES: "true"

include:
  - project: "devops/gitlab/ci-templates/ruby"
    ref: "sans-dind"
    file:
      - ".rspec.yml"
      - ".rubocop.yml"
  
  - component: gitlab.library.upenn.edu/devops/gitlab/components/general/install_hashicorp_vault@~latest
  - component: gitlab.library.upenn.edu/devops/gitlab/components/docker/stage_build@~latest
    inputs:
      docker_build_context: "rails_app/"
      dockerfile_path: "rails_app/"
      dockerfile_filename: "Dockerfile"
      stage: "build_base"
      docker_build_secrets: "--secret id=sidekiq_pro_credentials,env=SIDEKIQ_PRO_CREDENTIALS"
      docker_target: "base"
      job_suffix: "_base"
      matrix:
        - RUNNER: build
          DOCKER_BUILD_PLATFORM: "linux/amd64"
    variables:
      SIDEKIQ_PRO_CREDENTIALS: "$SIDEKIQ_PRO_CREDENTIALS"
  - component: gitlab.library.upenn.edu/devops/gitlab/components/docker/stage_build@~latest
    inputs:
      docker_build_context: "rails_app/"
      dockerfile_path: "rails_app/"
      dockerfile_filename: "Dockerfile"
      stage: "build_development"
      docker_build_secrets: "--secret id=sidekiq_pro_credentials,env=SIDEKIQ_PRO_CREDENTIALS"
      docker_target: "development"
      job_suffix: "_development"
      docker_build_args: "--build-arg RAILS_ENV=development"
      matrix:
      - RUNNER: build
        DOCKER_BUILD_PLATFORM: "linux/amd64"
    variables:
      SIDEKIQ_PRO_CREDENTIALS: "$SIDEKIQ_PRO_CREDENTIALS"
  - component: gitlab.library.upenn.edu/devops/gitlab/components/docker/stage_build@~latest
    inputs:
      dockerfile_path: "rails_app/"
      docker_build_context: "rails_app/"
      stage: "build_production"
      docker_build_secrets: "--secret id=sidekiq_pro_credentials,env=SIDEKIQ_PRO_CREDENTIALS"
      docker_additional_cache_targets: "base development"
      docker_build_args: "--build-arg RAILS_ENV=production"
      docker_target: "production"
      job_suffix: "_production"
      matrix:
      - RUNNER: build
        DOCKER_BUILD_PLATFORM: "linux/amd64"
    variables:
      SIDEKIQ_PRO_CREDENTIALS: "$SIDEKIQ_PRO_CREDENTIALS"
  - component: $CI_SERVER_FQDN/devops/gitlab/components/sast/trivy@~latest
    inputs:
      docker_tag_to_scan: "${CI_COMMIT_SHA}"
      job_image_tag: "29-dind"
      needs:
        - "amend_manifest_production"
      stage: "test"
  - component: gitlab.library.upenn.edu/devops/gitlab/components/docker/stage_finalize@~latest
    inputs:
      needs_copy:
        - trivy_scan
  - component: gitlab.library.upenn.edu/devops/gitlab/components/deploy/deploy@~latest
    inputs:
      deploy_environment: "staging"
      deploy_environment_url: "https://indexing-staging.library.upenn.edu"
      deploy_host: ${DEPLOY_HOST}
      job_suffix: "staging"
      valid_principals: ${VALID_PRINCIPALS}
      vault_auth_role: ${JWT_ROLE}
      vault_ssh_client_role: ${VAULT_SSH_CLIENT_ROLE}
      image_tag: ${CI_COMMIT_SHORT_SHA}
  - component: gitlab.library.upenn.edu/devops/gitlab/components/deploy/deploy@~latest
    inputs:
      deploy_environment: "production"
      deploy_environment_url: "https://indexing.library.upenn.edu"
      deploy_host: ${DEPLOY_HOST}
      job_suffix: "production"
      valid_principals: ${VALID_PRINCIPALS}
      vault_auth_role: ${JWT_ROLE}
      vault_ssh_client_role: ${VAULT_SSH_CLIENT_ROLE}
      image_tag: ${CI_COMMIT_SHORT_SHA}
  - component: gitlab.library.upenn.edu/devops/gitlab/components/general/vault_jwt_auth@~latest
    inputs:
      vault_auth_role: ${JWT_ROLE}

workflow:
  rules:
  - when: always

stages:
  - build_base
  - build_development
  - build_production
  - test
  - finalize
  - deploy

# -- Start - test dev image
rspec_app_test:
  stage: test
  image: ${CI_REGISTRY_IMAGE}/${CI_PIPELINE_ID}:${CI_COMMIT_SHORT_SHA}-development
  services:
    - name: browserless/chrome:latest
      alias: chrome
      variables:
        CONNECTION_TIMEOUT: 600000
    - name: postgres:14
      variables:
        POSTGRES_DB: "catalog_indexing_test"
        POSTGRES_PASSWORD: "rspec_test"
        POSTGRES_USER: "rspec_test"
    - name: bitnamilegacy/solr:9.6.1
      alias: solr
      entrypoint: [""]
      command: [
        "/bin/bash",
        "-c",
        "./opt/bitnami/scripts/solr/entrypoint.sh /opt/bitnami/scripts/solr/run.sh & \n
        for ((i = 0; i <= 9; i += 1)); do \n
          curl --silent 'http://solr:8983/api/' && break; \n
          echo 'Waiting for solr api to be ready'; \n
          sleep '10s'; \n
        done \n
        ./opt/bitnami/solr/bin/solr create_collection -d ${CI_PROJECT_DIR}/rails_app/solr/conf -c ${SOLR_TEST_COLLECTION} -n ${SOLR_TEST_CONFIGNAME} \n
        wait \n
        for ((i = 0; i <= 9; i += 1)); do \n
          curl --silent http://solr:8983/solr/${SOLR_TEST_COLLECTION}/admin/ping && break; \n
          echo 'Waiting for test collection to be ready'; \n
          sleep '10s'; \n
        done \n
        "
      ]
      variables:
        SOLR_CLOUD_BOOTSTRAP: "yes"
        SOLR_ENABLE_AUTHENTICATION: "yes"
        SOLR_HOST: "solr"
        SOLR_JAVA_MEM: "-Xms4g -Xmx4g"
        SOLR_MODE: "solrcloud"
        SOLR_OPTS: "-Dsolr.disableConfigSetsCreateAuthChecks=true"
        SOLR_TEST_COLLECTION: "catalog-indexing-test"
        SOLR_TEST_CONFIGNAME: "catalog-indexing"
        ZK_CREATE_CHROOT: "true"
        ZK_SCRIPT_LOCATION: "/opt/bitnami/solr/server/scripts/cloud-scripts"
  extends:
    - .rspec
  variables:
    APP_URL: "indexing.test.com"
    CHROME_URL: "http://chrome:3000"
    DATABASE_NAME: "indexing_test"
    DATABASE_PASSWORD: "rspec_test"
    DATABASE_USER: "rspec_test"
    FF_NETWORK_PER_BUILD: "true"
    RAILS_ENV: "test"
    RAILS_SYSTEM_TESTING_SCREENSHOT_HTML: "1"
    SOLR_URL: "http://solr:8983"
  script:
    - >
      for ((i = 0; i <= 9; i += 1)); do
        curl --silent "http://solr:8983/api/" "-H" "'Content-type:application/json'" && break
        echo "Waiting for solr api to be ready"
        sleep "10s"
      done
    - cd ${CI_PROJECT_DIR}/rails_app/
    - bundle add rspec_junit_formatter
    - bundle exec rails db:migrate
    - bundle exec rspec --format progress --format RspecJunitFormatter --out rspec.xml
  coverage: '/\(\d+.\d+\%\) covered/'
  artifacts:
    paths:
      - rails_app/tmp/coverage/index.html
      - rails_app/tmp/capybara
      - rails_app/rspec.xml
    expire_in: 1 week
    reports:
      junit: rails_app/rspec.xml
  rules:
    - if: $DISABLE_RSPEC_TEST == "true"
      when: never
    - exists:
        - rails_app/spec/**.rb
        - rails_app/spec/**/**.rb
  tags:
    - build

rubocop_app_test:
  stage: test
  image: ${CI_REGISTRY_IMAGE}/${CI_PIPELINE_ID}:${CI_COMMIT_SHORT_SHA}-development
  extends:
    - .rubocop
  before_script:
    - cd ${CI_PROJECT_DIR}/rails_app/
  rules:
    - if: $DISABLE_RUBOCOP == "true"
      when: never
    - exists:
        - rails_app/.rubocop.yml
  tags:
    - build
# -- End - test dev image

# Deploy staging
deploy_staging:
  only:
    - main

#Deploy production
deploy_production:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(\.[a-zA-Z0-9]+)?$/
#-- End - deployment

